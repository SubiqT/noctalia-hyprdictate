# Bar control and attached transcript panel for the hyprdictate daemon +
# Hyprland plugin. The bar remains compact; wrapped live text lives in panel.
#
# The plugin id follows Noctalia's <author>/<plugin> convention.
# Per the community-plugins layout, the directory name must match
# the part after the slash, so the plugin lives at `hyprdictate/`.

id           = "subiqt/hyprdictate"
name         = "Hyprdictate"
version      = "0.1.0"
# API 21 adds sticky scroll revision props used by the live transcript panel;
# API 10 added keyboard_focus for non-interactive attached panels. Keeping the
# panel unfocused avoids stealing keyboard input from the dictation target.
plugin_api   = 21
min_noctalia = "5.0.1"
author       = "subiqt"
license      = "MIT"
description  = "Bar control and attached live transcript panel for hyprdictate."
tags         = ["bar", "hyprland", "voice", "dictation", "indicator"]
# `nc` streams the daemon's UNIX socket. OpenBSD-style netcat is required for
# `-U`; NixOS ships this via libressl, and it is standard on Arch, Debian, and
# Fedora. GNU netcat lacks `-U` and will not work. hyprctl comes with Hyprland
# itself so it is not listed here.
dependencies = ["nc"]

[[widget]]
id    = "hyprdictate"
entry = "hyprdictate.luau"

  # Per-widget display settings.

  [[widget.setting]]
  key             = "show_state_text"
  type            = "bool"
  label_key       = "settings.show_state_text.label"
  description_key = "settings.show_state_text.description"
  default         = false

[[panel]]
id                       = "preview"
entry                    = "preview.luau"
width                    = 520
height                   = 132
placement                = "attached"
position                 = "auto"
keyboard_focus           = "none"
dismiss_on_outside_click = false
